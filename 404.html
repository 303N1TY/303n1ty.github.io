<!DOCTYPE html>
<!--
  GitHub Pages serves this for any missing URL under the site, at any depth,
  so everything is inline and the only external links are absolute (/...).
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — déjà vu · 303</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#030504">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo-303.svg">
  <style>
    @font-face { font-family: "Clash Display"; font-weight: 600; font-display: swap; src: url("/assets/fonts/clash-display-600.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 300 800; font-display: swap; src: url("/assets/fonts/jetbrains-mono-var.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 300; font-style: italic; font-display: swap; src: url("/assets/fonts/jetbrains-mono-300-italic.woff2") format("woff2"); }
    :root {
      --bg: #030504; --fg: #e6ece7; --muted: #6c7b71; --line: rgba(230, 236, 231, .1); --g: #3cff8f;
      --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
      --display: "Clash Display", "Arial Narrow", system-ui, sans-serif;
      --gutter: clamp(20px, 4vw, 64px);
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--fg); font: 400 15px/1.6 var(--mono); overflow: hidden;
      display: grid; grid-template-rows: auto 1fr auto; padding: 28px var(--gutter);
    }
    canvas { position: fixed; inset: 0; z-index: -1; width: 100%; height: 100%; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--g); outline-offset: 4px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    header a { text-decoration: none; display: flex; gap: 10px; align-items: center; }
    header b { color: var(--g); font-weight: 400; }
    main { align-self: center; display: grid; gap: 28px; max-width: 980px; }
    .code { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; align-items: center; }
    .code::before { content: ""; width: 6px; height: 6px; background: var(--g); }
    h1 { font: 600 clamp(64px, 14vw, 220px)/.9 var(--display); letter-spacing: -.01em; }
    h1 em { display: block; font: italic 300 .32em/1.2 var(--mono); margin-top: .2em; color: var(--g); letter-spacing: -.05em; }
    .term {
      border-top: 1px solid var(--line); padding-top: 22px; color: var(--muted);
      white-space: pre-wrap; word-break: break-all; font-size: clamp(13px, 1.2vw, 16px);
    }
    .term .p { color: var(--g); }
    .term .c::after { content: ""; display: inline-block; width: .6em; height: 1.1em; vertical-align: -.2em; background: var(--fg); animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .back {
      justify-self: start; display: inline-flex; gap: 14px; align-items: center; padding: 16px 26px;
      background: var(--g); color: #000; border-radius: 999px; text-decoration: none; font-weight: 500;
      transition: gap .4s cubic-bezier(.16, 1, .3, 1), background .3s;
    }
    .back:hover { gap: 26px; background: var(--fg); }
    footer { display: flex; gap: 24px; justify-content: space-between; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 18px; }
    /* the black cat walks by. Twice. */
    .cat { position: fixed; bottom: 64px; left: 0; color: var(--fg); font-size: 12px; line-height: 1.1; white-space: pre; opacity: .8;
      animation: walk 9s linear 1.2s 2 both; }
    @keyframes walk { from { transform: translateX(-120px); } to { transform: translateX(calc(100vw + 20px)); } }
    @media (prefers-reduced-motion: reduce) { .cat { display: none; } .term .c::after { animation: none; } }
  </style>
</head>
<body>
  <canvas id="rain" aria-hidden="true"></canvas>
  <header>
    <a href="/"><img src="/assets/img/logo-303.svg" alt="" width="22" height="22"><span>~/303/<b>404</b></span></a>
    <span data-t="tag" style="color:var(--muted);font-size:12px">glitch in the construct</span>
  </header>
  <main>
    <p class="code">error 404</p>
    <h1>Déjà vu.<em data-t="sub">this page isn't in the construct.</em></h1>
    <p class="term" id="term"></p>
    <a class="back" href="/"><span data-t="back">back to ~/303</span> <span aria-hidden="true">→</span></a>
  </main>
  <footer><span>303</span><span data-t="hint">a déjà vu is usually a glitch in the matrix.</span></footer>
  <pre class="cat" aria-hidden="true"> /\_/\
( o.o )
 > ^ <</pre>
  <script>
    (() => {
      const FR = {
        tag: "glitch dans le construct",
        sub: "cette page n'est pas dans le construct.",
        back: "retour à ~/303",
        hint: "une impression de déjà vu, c'est souvent un bug dans la matrice.",
        nf: "Aucun fichier ou dossier de ce type",
      };
      let lang = null;
      try { lang = localStorage.getItem("lang"); } catch {}
      if (lang !== "en" && lang !== "fr") lang = navigator.language?.toLowerCase().startsWith("fr") ? "fr" : "en";
      if (lang === "fr") {
        document.documentElement.lang = "fr";
        document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = FR[el.dataset.t] ?? el.textContent; });
      }
      const path = decodeURIComponent(location.pathname);
      const term = document.getElementById("term");
      const prompt = Object.assign(document.createElement("span"), { className: "p", textContent: "303@construct:~$ " });
      term.append(prompt, `cd ${path}\nbash: cd: ${path}: ${lang === "fr" ? FR.nf : "No such file or directory"}\n`);
      term.append(Object.assign(document.createElement("span"), { className: "p", textContent: "303@construct:~$ " }),
        Object.assign(document.createElement("span"), { className: "c" }));

      // light 2D rain, frozen under reduced motion
      const c = document.getElementById("rain"), g = c.getContext("2d");
      const G = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789404";
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const CELL = 18;
      let cols = [], w, h;
      const size = () => {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        w = innerWidth; h = innerHeight;
        c.width = w * dpr; c.height = h * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
        cols = Array.from({ length: Math.ceil(w / CELL) }, () => ({ y: Math.random() * -h, v: 0.15 + Math.random() * 0.35 }));
        g.fillStyle = "#030504"; g.fillRect(0, 0, w, h);
      };
      const frame = () => {
        g.fillStyle = "rgba(3,5,4,.09)"; g.fillRect(0, 0, w, h);
        g.font = `500 ${CELL * 0.8}px "JetBrains Mono", monospace`;
        cols.forEach((col, i) => {
          col.y += col.v * CELL * 0.35;
          const y = Math.floor(col.y / CELL) * CELL;
          g.fillStyle = "rgba(60,255,143,.26)";
          g.fillText(G[(Math.random() * G.length) | 0], i * CELL, y);
          if (col.y > h + Math.random() * h) col.y = Math.random() * -200;
        });
        if (!still) requestAnimationFrame(frame);
      };
      size();
      addEventListener("resize", size);
      if (still) for (let k = 0; k < 120; k++) frame(); else requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
